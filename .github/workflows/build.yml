name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project WiFiConnectionCounter.xcodeproj \
            -scheme WiFiConnectionCounter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WiFiConnectionCounter.app Payload/
          zip -qry WiFiConnectionCounter.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiConnectionCounter-ipa
          path: WiFiConnectionCounter.ipa

      - name: Publish release (direct .ipa download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WiFi Counter build ${{ github.run_number }}
          files: WiFiConnectionCounter.ipa
