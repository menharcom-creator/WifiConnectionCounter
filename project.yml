name: WiFiConnectionCounter
options:
  bundleIdPrefix: com.menhar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WiFiConnectionCounter:
    type: application
    platform: iOS
    sources:
      - WiFiConnectionCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.menhar.wificonnectioncounter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: WiFiConnectionCounter/Info.plist
      properties:
        CFBundleDisplayName: WiFi Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: WiFi Counter needs local network access to find the devices connected to the same Wi-Fi as this phone.
